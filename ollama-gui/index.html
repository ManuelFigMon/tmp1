<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ollama Chat</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #667085;
    --border: #d9dde4; --accent: #2563eb; --accent-text: #ffffff;
    --user: #e8f0fe; --bot: #ffffff; --error: #b42318; --ok: #067647;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --panel: #1a1f27; --text: #e6e9ef; --muted: #98a2b3;
      --border: #2c3340; --accent: #3b82f6; --accent-text: #ffffff;
      --user: #1e2a44; --bot: #1a1f27; --error: #f97066; --ok: #47cd89;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); height: 100vh; display: flex;
  }
  aside {
    width: 300px; flex-shrink: 0; background: var(--panel); border-right: 1px solid var(--border);
    padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px;
  }
  aside h1 { font-size: 18px; margin: 0 0 4px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
  input, select, textarea, button { font: inherit; color: var(--text); }
  input, select, textarea {
    background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 7px 9px; width: 100%;
  }
  textarea { resize: vertical; }
  button {
    border: 1px solid var(--border); background: var(--panel); border-radius: 6px;
    padding: 7px 12px; cursor: pointer;
  }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .hint { font-size: 12px; color: var(--muted); margin: 0; }
  #status { font-size: 13px; }
  #status.ok { color: var(--ok); }
  #status.err { color: var(--error); }
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .msg {
    max-width: 820px; width: fit-content; padding: 10px 14px; border-radius: 10px;
    border: 1px solid var(--border); white-space: pre-wrap; word-wrap: break-word; overflow-wrap: anywhere;
  }
  .msg.user { background: var(--user); align-self: flex-end; }
  .msg.assistant { background: var(--bot); align-self: flex-start; }
  .msg.error { color: var(--error); align-self: flex-start; }
  .msg .meta { display: block; font-size: 11px; color: var(--muted); margin-top: 6px; }
  .empty { margin: auto; color: var(--muted); text-align: center; }
  form#composer { display: flex; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--border); background: var(--panel); }
  form#composer textarea { flex: 1; min-height: 44px; max-height: 200px; }
  @media (max-width: 760px) {
    body { flex-direction: column; height: auto; min-height: 100vh; }
    aside { width: 100%; border-right: none; border-bottom: 1px solid var(--border); }
    #messages { min-height: 50vh; padding: 16px; }
    form#composer { padding: 12px 16px; }
  }
</style>
</head>
<body>
<aside>
  <div>
    <h1>Ollama Chat</h1>
    <p class="hint">A minimal browser client for Ollama (or AnythingLLM / Open WebUI).</p>
  </div>

  <label>Backend type
    <select id="backend">
      <option value="ollama">Ollama native API (/api/chat)</option>
      <option value="openai">OpenAI-compatible (Ollama /v1, AnythingLLM, Open WebUI)</option>
    </select>
  </label>

  <label>Base URL
    <input id="baseUrl" placeholder="http://localhost:11434" spellcheck="false">
  </label>
  <p class="hint" id="urlHint"></p>

  <label>API key (optional; required by AnythingLLM / Open WebUI)
    <input id="apiKey" type="password" placeholder="Bearer token" autocomplete="off">
  </label>

  <div class="row">
    <button id="connectBtn" type="button">Connect</button>
  </div>
  <div id="status">Not connected</div>

  <label>Model
    <select id="model"><option value="">(connect to load models)</option></select>
  </label>

  <label>System prompt
    <textarea id="system" rows="3" placeholder="You are a helpful assistant."></textarea>
  </label>

  <label>Temperature: <span id="tempVal">0.7</span>
    <input id="temperature" type="range" min="0" max="2" step="0.1" value="0.7">
  </label>

  <div class="row">
    <button id="clearBtn" type="button">Clear chat</button>
  </div>
</aside>

<main>
  <div id="messages"><div class="empty" id="empty">Connect, pick a model, and say hello.</div></div>
  <form id="composer">
    <textarea id="prompt" placeholder="Type a message. Enter to send, Shift+Enter for a new line." rows="2"></textarea>
    <button id="sendBtn" class="primary" type="submit">Send</button>
    <button id="stopBtn" type="button" disabled>Stop</button>
  </form>
</main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const els = {
    backend: $("backend"), baseUrl: $("baseUrl"), apiKey: $("apiKey"), urlHint: $("urlHint"),
    connectBtn: $("connectBtn"), status: $("status"), model: $("model"), system: $("system"),
    temperature: $("temperature"), tempVal: $("tempVal"), clearBtn: $("clearBtn"),
    messages: $("messages"), empty: $("empty"), composer: $("composer"), prompt: $("prompt"),
    sendBtn: $("sendBtn"), stopBtn: $("stopBtn"),
  };

  // Conversation history in the shared chat format: [{role, content}]
  let history = [];
  let controller = null;

  // ---------- Settings (persisted per browser) ----------
  const URL_HINTS = {
    ollama: "Ollama: http://localhost:11434 — or this page's own address when served by serve.py / nginx (they proxy /api/* to Ollama).",
    openai: "Ollama: http://localhost:11434/v1 · AnythingLLM: http://localhost:3001/api/v1/openai (model = workspace slug) · Open WebUI: http://localhost:3000/api",
  };

  function defaultBaseUrl(backend) {
    // When the page is served over http(s) by serve.py or the bundled nginx, the
    // same origin proxies to Ollama, which avoids CORS entirely.
    const sameOrigin = location.protocol.startsWith("http") ? location.origin : "http://localhost:11434";
    return backend === "openai" ? sameOrigin + "/v1" : sameOrigin;
  }

  function loadSettings() {
    let saved = {};
    try { saved = JSON.parse(localStorage.getItem("ollama-gui-settings") || "{}"); } catch (_) {}
    els.backend.value = saved.backend || "ollama";
    els.baseUrl.value = saved.baseUrl || defaultBaseUrl(els.backend.value);
    els.apiKey.value = saved.apiKey || "";
    els.system.value = saved.system || "";
    els.temperature.value = saved.temperature ?? 0.7;
    els.tempVal.textContent = els.temperature.value;
    els.urlHint.textContent = URL_HINTS[els.backend.value];
    return saved.model || "";
  }

  function saveSettings() {
    const s = {
      backend: els.backend.value, baseUrl: els.baseUrl.value.trim(), apiKey: els.apiKey.value,
      system: els.system.value, temperature: els.temperature.value, model: els.model.value,
    };
    try { localStorage.setItem("ollama-gui-settings", JSON.stringify(s)); } catch (_) {}
  }

  // ---------- Backend adapters ----------
  // Each adapter knows how to list models and stream a chat completion.
  const base = () => els.baseUrl.value.trim().replace(/\/+$/, "");
  const headers = () => {
    const h = { "Content-Type": "application/json" };
    if (els.apiKey.value) h["Authorization"] = "Bearer " + els.apiKey.value;
    return h;
  };

  const adapters = {
    // Ollama REST API: GET /api/tags, POST /api/chat (newline-delimited JSON stream)
    ollama: {
      async listModels() {
        const res = await fetch(base() + "/api/tags", { headers: headers() });
        if (!res.ok) throw new Error(`HTTP ${res.status} ${await res.text()}`);
        const data = await res.json();
        return (data.models || []).map((m) => m.name);
      },
      async chat({ model, messages, temperature, signal, onToken }) {
        const res = await fetch(base() + "/api/chat", {
          method: "POST", headers: headers(), signal,
          body: JSON.stringify({ model, messages, stream: true, options: { temperature } }),
        });
        if (!res.ok) throw new Error(`HTTP ${res.status} ${await res.text()}`);
        let stats = null;
        await readLines(res, (line) => {
          const obj = JSON.parse(line);
          if (obj.error) throw new Error(obj.error);
          if (obj.message && obj.message.content) onToken(obj.message.content);
          if (obj.done) stats = obj;
        });
        if (stats && stats.eval_count && stats.eval_duration) {
          return `${stats.eval_count} tokens · ${(stats.eval_count / (stats.eval_duration / 1e9)).toFixed(1)} tok/s`;
        }
        return "";
      },
    },

    // OpenAI-compatible API: GET {base}/models, POST {base}/chat/completions (Server-Sent Events)
    // Works with Ollama's /v1, AnythingLLM's /api/v1/openai and Open WebUI's /api.
    openai: {
      async listModels() {
        const res = await fetch(base() + "/models", { headers: headers() });
        if (!res.ok) throw new Error(`HTTP ${res.status} ${await res.text()}`);
        const data = await res.json();
        return (data.data || []).map((m) => m.id);
      },
      async chat({ model, messages, temperature, signal, onToken }) {
        const res = await fetch(base() + "/chat/completions", {
          method: "POST", headers: headers(), signal,
          body: JSON.stringify({ model, messages, stream: true, temperature }),
        });
        if (!res.ok) throw new Error(`HTTP ${res.status} ${await res.text()}`);
        await readLines(res, (line) => {
          if (!line.startsWith("data:")) return;
          const payload = line.slice(5).trim();
          if (payload === "[DONE]") return;
          const obj = JSON.parse(payload);
          if (obj.error) throw new Error(obj.error.message || JSON.stringify(obj.error));
          const delta = obj.choices && obj.choices[0] && obj.choices[0].delta;
          if (delta && delta.content) onToken(delta.content);
        });
        return "";
      },
    },
  };

  // Reads a streaming response body and calls onLine for each non-empty line.
  async function readLines(res, onLine) {
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, nl).trim();
        buf = buf.slice(nl + 1);
        if (line) onLine(line);
      }
    }
    if (buf.trim()) onLine(buf.trim());
  }

  // ---------- UI ----------
  function setStatus(text, kind) {
    els.status.textContent = text;
    els.status.className = kind || "";
  }

  function addMessage(role, text) {
    els.empty.style.display = "none";
    const div = document.createElement("div");
    div.className = "msg " + role;
    div.textContent = text;
    els.messages.appendChild(div);
    els.messages.scrollTop = els.messages.scrollHeight;
    return div;
  }

  function setBusy(busy) {
    els.sendBtn.disabled = busy;
    els.stopBtn.disabled = !busy;
    els.prompt.disabled = busy;
  }

  async function connect(preferredModel) {
    saveSettings();
    setStatus("Connecting…");
    els.connectBtn.disabled = true;
    try {
      const models = await adapters[els.backend.value].listModels();
      els.model.innerHTML = "";
      if (!models.length) {
        els.model.innerHTML = '<option value="">(no models found — run "ollama pull llama3.2")</option>';
      }
      for (const name of models) {
        const opt = document.createElement("option");
        opt.value = opt.textContent = name;
        els.model.appendChild(opt);
      }
      if (preferredModel && models.includes(preferredModel)) els.model.value = preferredModel;
      setStatus(`Connected · ${models.length} model(s)`, "ok");
      saveSettings();
    } catch (err) {
      setStatus("Connection failed: " + explain(err), "err");
    } finally {
      els.connectBtn.disabled = false;
    }
  }

  function explain(err) {
    if (err instanceof TypeError) {
      return err.message + " — is the server running, and is this page's origin allowed (OLLAMA_ORIGINS / CORS)? See README.";
    }
    return err.message;
  }

  async function send(text) {
    const model = els.model.value;
    if (!model) { setStatus("Pick a model first (click Connect).", "err"); return; }

    history.push({ role: "user", content: text });
    addMessage("user", text);
    const bubble = addMessage("assistant", "");
    const messages = els.system.value.trim()
      ? [{ role: "system", content: els.system.value.trim() }, ...history]
      : history.slice();

    controller = new AbortController();
    setBusy(true);
    let reply = "";
    const started = performance.now();
    try {
      const meta = await adapters[els.backend.value].chat({
        model, messages, temperature: parseFloat(els.temperature.value), signal: controller.signal,
        onToken: (t) => {
          reply += t;
          bubble.textContent = reply;
          els.messages.scrollTop = els.messages.scrollHeight;
        },
      });
      const secs = ((performance.now() - started) / 1000).toFixed(1);
      appendMeta(bubble, `${model} · ${secs}s${meta ? " · " + meta : ""}`);
    } catch (err) {
      if (err.name === "AbortError") {
        appendMeta(bubble, "stopped");
      } else {
        bubble.remove();
        addMessage("error", "Error: " + explain(err));
      }
    } finally {
      if (reply) history.push({ role: "assistant", content: reply });
      else if (history.at(-1).role === "user") history.pop();
      controller = null;
      setBusy(false);
      els.prompt.focus();
    }
  }

  function appendMeta(bubble, text) {
    const span = document.createElement("span");
    span.className = "meta";
    span.textContent = text;
    bubble.appendChild(span);
  }

  // ---------- Events ----------
  els.backend.addEventListener("change", () => {
    els.baseUrl.value = defaultBaseUrl(els.backend.value);
    els.urlHint.textContent = URL_HINTS[els.backend.value];
    els.model.innerHTML = '<option value="">(connect to load models)</option>';
    setStatus("Not connected");
    saveSettings();
  });
  els.connectBtn.addEventListener("click", () => connect(els.model.value));
  els.model.addEventListener("change", saveSettings);
  els.system.addEventListener("change", saveSettings);
  els.temperature.addEventListener("input", () => { els.tempVal.textContent = els.temperature.value; saveSettings(); });
  els.clearBtn.addEventListener("click", () => {
    history = [];
    els.messages.querySelectorAll(".msg").forEach((m) => m.remove());
    els.empty.style.display = "";
  });
  els.stopBtn.addEventListener("click", () => controller && controller.abort());
  els.composer.addEventListener("submit", (e) => {
    e.preventDefault();
    const text = els.prompt.value.trim();
    if (!text || controller) return;
    els.prompt.value = "";
    send(text);
  });
  els.prompt.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); els.composer.requestSubmit(); }
  });

  const preferredModel = loadSettings();
  connect(preferredModel);
})();
</script>
</body>
</html>
