# Serves the GUI and reverse-proxies Ollama's API on the same origin (no CORS needed).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Ollama native API (/api/*) and OpenAI-compatible API (/v1/*)
    location ~ ^/(api|v1)/ {
        proxy_pass http://ollama:11434;
        proxy_http_version 1.1;
        proxy_set_header Host localhost:11434;
        # Same-origin now, so don't forward the browser Origin to Ollama.
        proxy_set_header Origin "";
        # Stream tokens to the browser as soon as Ollama produces them.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        client_max_body_size 50m;
    }
}
